<style>
/* ── facilit8 design tokens ── */
:root {
  --f8-blue:#0070C0; --f8-blue-bright:#0090E7; --f8-blue-deep:#005896; --f8-blue-tint:#E8F4FC;
  --f8-navy:#0A1628; --f8-navy-2:#142238;
  --f8-teal:#007B8A; --f8-teal-tint:#E6F4F6;
  --f8-amber:#B86A00; --f8-amber-tint:#FFF4E0;
  --f8-green:#1A6B3A; --f8-green-tint:#EAF6EE;
  --f8-purple:#5B3FA6; --f8-purple-tint:#F2EFFF;
  --f8-rose:#9B1D4A; --f8-rose-tint:#FCEEF4;
  --f8-red:#C0392B; --f8-red-tint:#FDEEEC;
  --f8-slate:#3D5166; --f8-slate-tint:#EDF1F5;
  --f8-off-white:#F5F7FA; --f8-fog:#E6ECF2; --f8-mist:#C9D2DD;
  --f8-grey:#6B7A99; --f8-ink:#1A1A2E; --f8-ink-soft:#3A3F55;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --shadow-1:0 1px 3px rgba(10,22,40,0.06);
  --shadow-2:0 4px 16px rgba(10,22,40,0.08),0 1px 3px rgba(10,22,40,0.04);
  --shadow-3:0 8px 32px rgba(10,22,40,0.12),0 2px 8px rgba(10,22,40,0.06);
  --dur:0.18s; --ease-out:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-sans);background:var(--f8-off-white);color:var(--f8-ink);-webkit-font-smoothing:antialiased;}

/* ── Nav ── */
.app-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:saturate(160%) blur(10px);-webkit-backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--f8-fog);}
.app-nav-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;height:64px;}
.app-nav-logo{font-size:17px;font-weight:800;color:var(--f8-navy);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;line-height:1;}
.app-nav-logo .lens{color:var(--f8-blue);}
.app-nav-sub{font-size:12.5px;color:var(--f8-grey);font-weight:500;flex:1;}
.lang-toggle{display:flex;border:1.5px solid var(--f8-mist);border-radius:20px;overflow:hidden;}
.lang-toggle button{border:none;background:transparent;font-family:var(--font-sans);font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;color:var(--f8-grey);transition:all var(--dur) var(--ease-out);}
.lang-toggle button.on{background:var(--f8-navy);color:#fff;}
.plan-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px;cursor:pointer;border:none;font-family:var(--font-sans);transition:all var(--dur) var(--ease-out);}
.plan-badge.basic{background:var(--f8-slate-tint);color:var(--f8-slate);border:1px solid var(--f8-mist);}
.plan-badge.premium{background:linear-gradient(135deg,#f0e8ff,#e8f4fc);color:var(--f8-purple);border:1px solid #c9bff0;}

/* ── Stage bar ── */
.stage-bar{background:#fff;border-bottom:1px solid var(--f8-fog);}
.stage-bar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:0 16px;}
.stage-bar-inner::-webkit-scrollbar{display:none;}
.stage-step{display:flex;align-items:center;gap:7px;padding:12px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-size:12.5px;font-weight:500;color:var(--f8-grey);user-select:none;transition:all var(--dur) var(--ease-out);}
.stage-step.done{color:var(--f8-green);}
.stage-step.active{color:var(--f8-navy);font-weight:600;border-bottom-color:var(--f8-blue);}
.stage-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:var(--f8-fog);color:var(--f8-grey);flex-shrink:0;}
.stage-step.done .stage-num{background:var(--f8-green-tint);color:var(--f8-green);}
.stage-step.active .stage-num{background:var(--f8-blue);color:#fff;}

/* ── Layout ── */
.workbench{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;}
@media(max-width:960px){.workbench{grid-template-columns:1fr;}.cascade-panel{position:static !important;order:-1;}}

/* ── Chat ── */
.chat-card{background:#fff;border-radius:var(--r-xl);border:1px solid var(--f8-fog);box-shadow:var(--shadow-2);display:flex;flex-direction:column;min-height:640px;overflow:hidden;}
.chat-head{padding:16px 22px;border-bottom:1px solid var(--f8-fog);display:flex;align-items:center;gap:10px;}
.chat-head .dot{width:8px;height:8px;border-radius:50%;background:var(--f8-green);box-shadow:0 0 0 3px var(--f8-green-tint);}
.chat-head-title{font-size:13.5px;font-weight:700;color:var(--f8-navy);}
.chat-head-phase{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--f8-blue);}
.chat-log{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:60vh;}
.msg{max-width:82%;padding:12px 16px;border-radius:var(--r-lg);font-size:14.5px;line-height:1.55;animation:pop .28s var(--ease-out);}
@keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg.bot{background:var(--f8-slate-tint);color:var(--f8-ink);border-top-left-radius:4px;align-self:flex-start;}
.msg.bot .lead{display:block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--f8-blue);margin-bottom:4px;}
.msg.user{background:var(--f8-blue);color:#fff;border-top-right-radius:4px;align-self:flex-end;}
.msg.challenge{background:var(--f8-purple-tint);border:1px solid #d9cff2;border-top-left-radius:4px;align-self:flex-start;}
.msg.challenge .lead{color:var(--f8-purple);}
.msg.note{background:var(--f8-amber-tint);border:1px solid #f0dcb2;align-self:flex-start;font-size:13.5px;}
.msg.note .lead{color:var(--f8-amber);}
.typing{display:inline-flex;gap:4px;padding:14px 18px;background:var(--f8-slate-tint);border-radius:var(--r-lg);border-top-left-radius:4px;align-self:flex-start;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--f8-grey);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

/* ── Input area ── */
.chat-input{border-top:1px solid var(--f8-fog);padding:16px 22px;background:#FBFCFE;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chip{border:1.5px solid var(--f8-mist);background:#fff;border-radius:20px;padding:8px 15px;font-family:var(--font-sans);font-size:13.5px;font-weight:600;color:var(--f8-ink-soft);cursor:pointer;transition:all var(--dur) var(--ease-out);}
.chip:hover{border-color:var(--f8-blue-bright);color:var(--f8-blue);}
.chip.sel{background:var(--f8-blue);border-color:var(--f8-blue);color:#fff;}
.chip.ghost{border-style:dashed;color:var(--f8-grey);}
.input-row{display:flex;gap:10px;}
.input-row textarea{flex:1;font-family:var(--font-sans);font-size:14.5px;color:var(--f8-ink);padding:11px 14px;border-radius:var(--r-md);border:1.5px solid var(--f8-mist);background:#fff;outline:none;resize:none;min-height:48px;max-height:120px;transition:border-color var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out);}
.input-row textarea:focus{border-color:var(--f8-blue-bright);box-shadow:0 0 0 3px rgba(0,144,231,0.12);}
.btn{border:none;font-family:var(--font-sans);font-weight:700;font-size:14px;border-radius:var(--r-md);cursor:pointer;transition:all var(--dur) var(--ease-out);display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn-primary{background:var(--f8-blue);color:#fff;padding:12px 22px;}
.btn-primary:hover{background:var(--f8-blue-deep);}
.btn-primary:disabled{background:var(--f8-mist);cursor:default;}
.btn-secondary{background:#fff;color:var(--f8-blue);border:1.5px solid var(--f8-blue);padding:11px 20px;}
.btn-secondary:hover{background:var(--f8-blue-tint);}
.btn-premium{background:linear-gradient(135deg,var(--f8-purple),#7a5fd0);color:#fff;padding:12px 22px;}
.btn-premium:hover{filter:brightness(1.08);}
.input-hint{font-size:11.5px;color:var(--f8-grey);margin-top:8px;}
.multi-actions{display:flex;justify-content:flex-end;margin-top:4px;}

/* ── Cascade panel ── */
.cascade-panel{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;}
.cascade-card{background:var(--f8-navy);border-radius:var(--r-xl);padding:20px;color:#fff;box-shadow:var(--shadow-2);}
.cascade-title{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7FC4F0;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.cascade-slot{border-left:3px solid rgba(255,255,255,0.14);padding:8px 0 8px 14px;margin-bottom:4px;transition:all var(--dur) var(--ease-out);}
.cascade-slot .slot-label{font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);}
.cascade-slot .slot-value{font-size:13px;line-height:1.5;color:rgba(255,255,255,0.85);margin-top:3px;min-height:16px;}
.cascade-slot.empty .slot-value{color:rgba(255,255,255,0.28);font-style:italic;}
.cascade-slot.filled{border-left-color:var(--f8-blue-bright);}
.cascade-slot.filled .slot-label{color:#7FC4F0;}
.cascade-slot.ai{border-left-color:rgba(180,150,255,0.35);}
.cascade-slot.ai.filled{border-left-color:#B49AF5;}
.cascade-slot.ai.filled .slot-label{color:#CDB8FA;}
.tension-card{background:#fff;border:1px solid var(--f8-fog);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-1);}
.tension-title{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--f8-amber);margin-bottom:10px;}
.tension-item{font-size:12.5px;color:var(--f8-ink-soft);line-height:1.5;padding:6px 0;border-bottom:1px dashed var(--f8-fog);}
.tension-item:last-child{border-bottom:none;}
.tension-item b{color:var(--f8-ink);}
.tension-empty{font-size:12.5px;color:var(--f8-grey);font-style:italic;}

/* ── Dashboard ── */
.dashboard{max-width:1240px;margin:0 auto;padding:24px;display:none;}
.dash-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.dash-head h1{font-size:clamp(22px,3.5vw,32px);font-weight:800;letter-spacing:-0.02em;color:var(--f8-navy);line-height:1.2;}
.dash-head .sub{font-size:14px;color:var(--f8-ink-soft);margin-top:6px;}
.dash-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;}
.dcard{background:#fff;border:1px solid var(--f8-fog);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow-1);}
.dcard h3{font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.span12{grid-column:span 12;}.span8{grid-column:span 8;}.span6{grid-column:span 6;}.span4{grid-column:span 4;}
@media(max-width:960px){.span8,.span6,.span4{grid-column:span 12;}}

/* cascade visual on dashboard */
.cascade-flow{display:flex;flex-direction:column;gap:0;}
.cf-step{display:flex;gap:16px;align-items:stretch;}
.cf-rail{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0;}
.cf-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--f8-blue);flex-shrink:0;z-index:1;}
.cf-line{width:2px;flex:1;background:var(--f8-fog);min-height:14px;}
.cf-body{padding:2px 0 22px;}
.cf-label{font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--f8-blue);}
.cf-value{font-size:14.5px;color:var(--f8-ink);line-height:1.55;margin-top:4px;max-width:640px;}
.cf-step.ai .cf-dot{background:var(--f8-purple);}
.cf-step.ai .cf-label{color:var(--f8-purple);}
.cf-not{font-size:12.5px;color:var(--f8-rose);margin-top:5px;font-weight:600;}

/* scorecard */
.sc-row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:0;border:1px solid var(--f8-fog);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;}
.sc-cell{padding:13px 15px;font-size:13px;line-height:1.5;border-right:1px solid var(--f8-fog);position:relative;}
.sc-cell:last-child{border-right:none;}
.sc-cell .k{display:block;font-size:9.5px;font-weight:700;letter-spacing:0.11em;text-transform:uppercase;color:var(--f8-grey);margin-bottom:4px;}
.sc-cell.choice{background:var(--f8-blue-tint);}.sc-cell.choice .k{color:var(--f8-blue);}
.sc-cell.lead{background:var(--f8-teal-tint);}.sc-cell.lead .k{color:var(--f8-teal);}
.sc-cell.impact{background:var(--f8-green-tint);}.sc-cell.impact .k{color:var(--f8-green);}
.sc-arrow{position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:13px;height:13px;background:inherit;border-top:1px solid var(--f8-fog);border-right:1px solid var(--f8-fog);rotate:45deg;z-index:1;}
@media(max-width:760px){.sc-row{grid-template-columns:1fr;}.sc-cell{border-right:none;border-bottom:1px solid var(--f8-fog);}.sc-arrow{display:none;}}
.sc-legend{font-size:12px;color:var(--f8-grey);margin-top:6px;line-height:1.5;}

/* WWHTBT list */
.wwhtbt-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--f8-fog);}
.wwhtbt-item:last-child{border-bottom:none;}
.wwhtbt-flag{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:12px;flex-shrink:0;margin-top:2px;}
.wwhtbt-flag.ok{background:var(--f8-green-tint);color:var(--f8-green);}
.wwhtbt-flag.test{background:var(--f8-amber-tint);color:var(--f8-amber);}
.wwhtbt-flag.risk{background:var(--f8-red-tint);color:var(--f8-red);}
.wwhtbt-text{font-size:13.5px;line-height:1.55;color:var(--f8-ink-soft);}
.wwhtbt-text b{color:var(--f8-ink);}

/* challenger */
.challenger-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--f8-fog);}
.challenger-item:last-child{border-bottom:none;}
.ch-ico{width:28px;height:28px;border-radius:8px;background:var(--f8-purple-tint);color:var(--f8-purple);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.ch-body{font-size:13.5px;line-height:1.55;color:var(--f8-ink-soft);}
.ch-body b{color:var(--f8-ink);}
.ch-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:var(--f8-purple);background:var(--f8-purple-tint);border-radius:10px;padding:2px 8px;margin-bottom:4px;}

/* sprint */
.sprint-item{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--f8-fog);align-items:flex-start;}
.sprint-item:last-child{border-bottom:none;}
.sprint-week{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--f8-teal);background:var(--f8-teal-tint);border-radius:8px;padding:4px 9px;flex-shrink:0;white-space:nowrap;margin-top:2px;}
.sprint-text{font-size:13.5px;line-height:1.55;color:var(--f8-ink-soft);}
.sprint-text b{color:var(--f8-ink);}

/* storyboard */
.story-arc{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
@media(max-width:900px){.story-arc{grid-template-columns:1fr;}}
.story-panel{border:1px solid var(--f8-fog);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;background:#FBFCFE;}
.story-panel .sp-num{width:26px;height:26px;border-radius:50%;background:var(--f8-navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.story-panel .sp-role{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--f8-rose);}
.story-panel .sp-title{font-size:13.5px;font-weight:700;color:var(--f8-navy);}
.story-panel .sp-text{font-size:12.5px;line-height:1.55;color:var(--f8-ink-soft);}
.story-tips{margin-top:14px;background:var(--f8-amber-tint);border:1px solid #f0dcb2;border-radius:var(--r-md);padding:13px 16px;font-size:12.5px;line-height:1.6;color:var(--f8-ink-soft);}
.story-tips b{color:var(--f8-amber);}

/* locked premium card */
.locked{position:relative;overflow:hidden;}
.locked .lock-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0.94) 55%);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:2;}
.lock-veil .lv-title{font-size:15px;font-weight:800;color:var(--f8-navy);}
.lock-veil .lv-sub{font-size:13px;color:var(--f8-ink-soft);max-width:380px;line-height:1.55;}

/* misc */
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:12px;}
.pill.free{background:var(--f8-green-tint);color:var(--f8-green);}
.pill.paid{background:var(--f8-purple-tint);color:var(--f8-purple);}
.disclaimer{font-size:12px;color:var(--f8-grey);line-height:1.6;border-top:1px solid var(--f8-fog);margin-top:24px;padding-top:14px;}
.email-status{width:100%;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--r-md);margin-top:2px;}
.email-status.ok{background:var(--f8-green-tint);color:var(--f8-green);}
.email-status.err{background:var(--f8-red-tint);color:var(--f8-red);}
.email-status.pending{background:var(--f8-slate-tint);color:var(--f8-slate);}
.footer{max-width:1240px;margin:0 auto;padding:20px 24px 48px;font-size:12px;color:var(--f8-grey);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.footer b{color:var(--f8-navy);}

/* prototype banner */
.proto-banner{background:var(--f8-navy);color:rgba(255,255,255,0.85);font-size:12px;padding:8px 24px;text-align:center;line-height:1.5;}
.proto-banner b{color:#7FC4F0;}
/* challenge transparency */
.ch-why{font-size:11.5px;color:var(--f8-grey);margin-top:7px;font-style:italic;border-top:1px dashed #d9cff2;padding-top:6px;}
.q-hint{display:block;font-size:12.5px;color:var(--f8-grey);font-style:italic;margin-top:6px;}
/* alignment */

const $ = id => document.getElementById(id);
const T = obj => obj ? (obj[S.lang] || obj.en) : '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s,n) => { s=String(s); return s.length>n ? s.slice(0,n-1).trimEnd()+'…' : s; };
const chipLabel = (step,v) => { const c=(step.chips||[]).find(x=>x.v===v); return c ? T(c) : v; };
const FLUFF = /(world[- ]?class|weltklasse|best[- ]in[- ]class|leading|führend|innovativ|innovative|synerg|holistic|ganzheitlich|customer[- ]centric|kundenzentriert|quality|qualität|excellen)/i;

let multiSel = [];  // current multi-select
let wwhtbtList = []; let wwhtbtIdx = 0;

/* ══════════════════════ I18N RENDER ══════════════════════ */
function setLang(l){
  /* language locked mid-session: register shifts break the conversation thread */
  if(l!==S.lang && S.step>0 && !S.finished){ addMsg('note', T(UI.langLocked)); return; }
  S.lang = l;
  document.documentElement.lang = l;
  $('lang-en').classList.toggle('on', l==='en');
  $('lang-de').classList.toggle('on', l==='de');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = T(UI[el.dataset.i18n]); });

}
function renderPlanBadge(){

}

/* ══════════════════════ STAGE BAR ══════════════════════ */
const PHASE_ORDER=['setup','diagnose','aspire','where','how','cap','sys','ai','test','measure','align','dash'];
function currentPhase(){ return S.finished ? 'dash' : (FLOW[S.step] ? FLOW[S.step].phase : 'dash'); }
function renderStageBar(){
  const cur=currentPhase(); const curIdx=PHASE_ORDER.indexOf(cur);
  $('stage-bar').innerHTML = PHASE_ORDER.map((p,i)=>{
    const cls = i<curIdx?'done':(i===curIdx?'active':'');
    const mark = i<curIdx?'✓':(i+1);
    return `<div class="stage-step ${cls}"><span class="stage-num">${mark}</span>${T(UI.phases[p])}</div>`;
  }).join('');
  $('chat-phase').textContent = T(UI.phases[cur]);
}

/* ══════════════════════ CHAT ══════════════════════ */
function addMsg(cls, html, lead){
  const log=$('chat-log');
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.innerHTML=(lead?`<span class="lead">${lead}</span>`:'')+html;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function botSay(html, lead, cls='bot'){
  return new Promise(res=>{
    const log=$('chat-log');
    const t=document.createElement('div'); t.className='typing'; t.innerHTML='<span></span><span></span><span></span>';
    log.appendChild(t); log.scrollTop=log.scrollHeight;
    setTimeout(()=>{ t.remove(); addMsg(cls, html, lead); res(); }, 550+Math.min(html.length*3,700));
  });
}
function userSay(text){ addMsg('user', esc(text).replace(/\n/g,'<br>')); }

/* ══════════════════════ INPUT RENDERING ══════════════════════ */
function renderInput(){
  const step=FLOW[S.step]; const box=$('chat-input');
  if(!step || S.finished){ box.innerHTML=''; return; }
  if(step.type==='text'){
    box.innerHTML=`<div class="input-row">
        <textarea id="txt" rows="2" placeholder="…"></textarea>
        <button class="btn btn-primary" onclick="submitText()">${T(UI.send)}</button>
      </div>
      <div class="input-hint">${T(UI.inputHint)}${step.optional?` · <a href="#" onclick="submitSkip();return false;">${T(UI.skip)}</a>`:''}</div>`;
    const ta=$('txt');
    ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitText();} });
    ta.focus();
  } else if(step.type==='chips'||step.type==='chipsFromCaps'){
    let chips = step.chips||[];
    if(step.type==='chipsFromCaps'){
      const capsStep=FLOW.find(s=>s.id==='caps');
      chips=(S.answers.caps||[]).map(v=>({v, en:chipLabel(capsStep,v), de:chipLabel(capsStep,v)}));
      chips.push({v:'none', en:'None — all strong', de:'Keine — alle stark'});
    }
    if(retried[step.id] && step.check==='price') chips=chips.filter(c=>c.v!=='price');
    box.innerHTML=`<div class="chips">${chips.map(c=>`<button class="chip" onclick="submitChip('${c.v}')">${T(c)}</button>`).join('')}
      ${step.allowOther?`<button class="chip ghost" onclick="showOther()">${T(UI.otherChip)}</button>`:''}</div>
      <div id="other-slot"></div>`;
  } else if(step.type==='multi'){
    multiSel=[];
    box.innerHTML=`<div class="chips" id="multi-chips">${step.chips.map(c=>`<button class="chip" data-v="${c.v}" onclick="toggleMulti('${c.v}')">${T(c)}</button>`).join('')}</div>
      <div class="multi-actions"><button class="btn btn-primary" id="multi-ok" disabled onclick="submitMulti()">${T(UI.confirmChips)}</button></div>`;
  } else if(step.type==='wwhtbt'){
    renderWwhtbtInput();
  }
}
function showOther(){
  $('other-slot').innerHTML=`<div class="input-row" style="margin-top:6px;">
    <textarea id="txt" rows="2"></textarea>
    <button class="btn btn-primary" onclick="submitText()">${T(UI.send)}</button></div>`;
  $('txt').focus();
}
function toggleMulti(v){
  const step=FLOW[S.step];
  const i=multiSel.indexOf(v);
  if(i>=0) multiSel.splice(i,1);
  else { if(multiSel.length>=step.max){ return; } multiSel.push(v); }
  document.querySelectorAll('#multi-chips .chip').forEach(el=>el.classList.toggle('sel',multiSel.includes(el.dataset.v)));
  $('multi-ok').disabled=multiSel.length===0;
}

/* ══════════════════════ SUBMITS ══════════════════════ */
function submitText(){
  const ta=$('txt'); if(!ta) return;
  const v=ta.value.trim(); if(!v) return;
  handleAnswer(v);
}
function submitSkip(){ handleAnswer('', true); }
function submitChip(v){ handleAnswer(v); }
function submitMulti(){ handleAnswer(multiSel.slice()); }

async function handleAnswer(val, skipped=false){
  const step=FLOW[S.step];
  if(!skipped){
    const label = Array.isArray(val) ? val.map(v=>chipLabel(step,v)).join(' · ')
                : (step.chips ? chipLabel(step,val) : val);
    userSay(label);
  }
  $('chat-input').innerHTML='';
  /* challenge pass — once per step; always shows WHY it was flagged (quality made visible) */
  if(!skipped && step.check && !retried[step.id]){
    const ch = runCheck(step, val);
    if(ch){
      retried[step.id]=true;
      const body=T(ch.msg)+(ch.why?`<div class="ch-why">${T(ch.why)}</div>`:'');
      if(ch.retry){ await botSay(body, T(UI_CH.lead), 'challenge'); saveState(); renderInput(); return; }
      else { await botSay(body, T(UI_CH.lead), 'challenge'); }
    }
  }
  /* store */
  if(step.id==='company') S.answers.company=val;
  if(step.key) S.answers[step.key]=val;
  if(step.tension) addTension(step.tension);
  if(step.id==='notPlay' && !/(nothing|none|nichts|keine|nix)/i.test(String(val))) addTension('focusOptions');
  if(step.id==='aiFirst') addTension('quickFoundation');
  renderCascade();
  /* after-hooks */
  if(step.after==='diagSummary') await sayDiagSummary();
  /* advance */
  S.step++;
  saveState();
  const next=FLOW[S.step];
  renderStageBar();
  if(!next){ return finishConversation(); }
  if(next.type==='wwhtbt'){ await startWwhtbt(next); return; }
  await askStep(next);
}
async function askStep(step){
  let q=esc(T(step.q)).replace(/\n/g,'<br>');
  /* sector-anchored AI example — the 6th choice must not collapse into generic tools */
  if(step.id==='aiFirst' && SECTOR_AI[S.answers.sector]) q+=`<span class="q-hint">${T(SECTOR_AI[S.answers.sector])}</span>`;
  if(step.id==='aiData' && S.answers.underused) q+=`<span class="q-hint">${S.lang==='de'?'Sie nannten vorhin':'Earlier you named'}: «${esc(trunc(S.answers.underused,60))}»</span>`;
  await botSay(q, step.lead?T(step.lead):null);
  renderInput();
}

    why:{en:'Why flagged: alignment gap — exactly the input the alignment process is built for.',de:'Warum markiert: Alignment-Lücke — genau der Input, für den der Alignment-Prozess gebaut ist.'}}

function runCheck(step, val){
  const v=Array.isArray(val)?val.join(' '):String(val);
  switch(step.check){
    case 'short': if(v.length<12){S.flags.push('thin');return CH.short;} return null;
    case 'aspiration':
      if(v.length<15 || FLUFF.test(v) || /^(grow|increase|double|wachsen|steigern|verdoppeln|\+?\d+\s?%)/i.test(v)){S.flags.push('goalNotChoice');return CH.aspiration;} return null;
    case 'everywhere': if(/(^|\s)(all|every|everywhere|worldwide|global|alle|überall|weltweit)(\s|$|\.)/i.test(v)){S.flags.push('everywhere');addTension('standardPersonal');return CH.everywhere;} return null;
    case 'nothing': if(/(nothing|none|nichts|keine|nix)/i.test(v)&&v.length<28){S.flags.push('noSacrifice');return CH.nothing;} return null;
    case 'fluff': if(FLUFF.test(v)){S.flags.push('fluff');return CH.fluff;} return null;
    case 'price': if(v==='price'){S.flags.push('price');return CH.price;} return null;
    case 'adoption': if(/(won'?t|will not|unlikely|not sure|nein|nicht|kaum|schwierig|unsicher|weiss nicht)/i.test(v)){S.flags.push('adoption');addTension('techAdoption');return CH.adoption;} return null;
    case 'aiNone':
      if(v==='none'&&S.answers.urgency==='existential'){S.flags.push('aiNone');return CH.aiNone;}
      if(v==='none'){S.flags.push('aiNoneOk');return CH.aiNoneSoft;} return null;
    case 'align':
      if(v==='split'||v==='untested'){S.flags.push('misaligned');return CH.align;} return null;
  }
  return null;
}

async function startWwhtbt(step){
  wwhtbtList=buildWwhtbtList(); wwhtbtIdx=0;

  askWwhtbtItem();
}
async function askWwhtbtItem(){
  if(wwhtbtIdx>=wwhtbtList.length){
    const r=Object.values(S.wwhtbtRatings);
    const ok=r.filter(x=>x==='ok').length, te=r.filter(x=>x==='test').length, ri=r.filter(x=>x==='risk').length;
    const en=`${ok} solid · ${te} to test · ${ri} uncomfortable.<br>The uncomfortable ones are not fears — they are your test agenda. Now we make it measurable.`;
    const de=`${ok} solide · ${te} zu testen · ${ri} mit Unbehagen.<br>Das Unbehagen ist keine Angst — es ist Ihre Test-Agenda. Jetzt machen wir es messbar.`;
    await botSay(S.lang==='de'?de:en, S.lang==='de'?'Zwischenstand':'Where you stand','note');
    S.step++; renderStageBar();
    const next=FLOW[S.step];
    await botSay(esc(T(next.q)), next.lead?T(next.lead):null);
    renderInput(); return;
  }
  const item=wwhtbtList[wwhtbtIdx];
  await botSay((S.lang==='de'?'Müsste wahr sein: ':'Would have to be true: ')+T(item));
  renderWwhtbtInput();
}
function renderWwhtbtInput(){
  $('chat-input').innerHTML=`<div class="chips">

    <button class="chip" onclick="rateWwhtbt('risk')">⚠ ${T(UI.ratingRisk)}</button>
  </div>`;
}
function rateWwhtbt(r){
  S.wwhtbtRatings[wwhtbtIdx]=r;
  userSay(r==='ok'?T(UI.ratingOk):r==='test'?T(UI.ratingTest):T(UI.ratingRisk));
  $('chat-input').innerHTML='';
  wwhtbtIdx++;
  saveState();
  askWwhtbtItem();
}

/* ══════════════════════ SAVE / RESUME (device-local only) ══════════════════════ */
const SAVE_KEY='strategylens.v1';
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({S, retried, wwhtbtIdx})); }catch(e){}
}
function loadState(){
  try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function clearState(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
async function resumeSession(saved){
  Object.assign(S, saved.S); retried=saved.retried||{}; wwhtbtIdx=saved.wwhtbtIdx||0;
  window.S=S;
  setLangUnlocked(S.lang);
  renderStageBar(); renderCascade(); renderTensions(); renderPlanBadge();
  if(S.finished){ wwhtbtList=buildWwhtbtList(); openDashboard(); return; }
  const step=FLOW[S.step];
  if(step && step.type==='wwhtbt'){ wwhtbtList=buildWwhtbtList(); await botSay(esc(T(step.q)), T(step.lead)); askWwhtbtItem(); return; }
  if(step){ await askStep(step); }
}
function setLangUnlocked(l){ const st=S.step; S.step=0; setLang(l); S.step=st; }

      <h3 style="color:var(--f8-blue);">🤝 ${T(UI.alignH)} <span class="pill free">${T(UI.freeBadge)}</span></h3>
      ${alignBlock(a)}
    </div>

    <div class="dcard span6 ${S.plan==='premium'?'':'locked'}">
      <h3 style="color:var(--f8-purple);">⚔ ${T(UI.challengerH)} <span class="pill paid">${T(UI.paidBadge)}</span></h3>
      ${lockCard(genChallengerItems().map(it=>`<div class="challenger-item">
        <div class="ch-ico">⚔</div>
        <div class="ch-body"><span class="ch-tag">${T(it.tag)}</span><br>${T(it)}</div></div>`).join(''),'lockChallenger','lockChallengerSub')}
    </div>

    <div class="dcard span6 ${S.plan==='premium'?'':'locked'}">
      <h3 style="color:var(--f8-teal);">🚀 ${T(UI.sprintH)} <span class="pill paid">${T(UI.paidBadge)}</span></h3>
      ${lockCard(genSprint().map(it=>`<div class="sprint-item">
        <span class="sprint-week">${it.w}</span>
        <div class="sprint-text">${T(it)}</div></div>`).join(''),'lockSprint','lockSprintSub')}
    </div>

    <div class="dcard span6 ${S.plan==='premium'?'':'locked'}">
      <h3 style="color:var(--f8-navy);">🧭 ${T(UI.processH)} <span class="pill paid">${T(UI.paidBadge)}</span></h3>
      ${lockCard(processBlock(),'lockProcess','lockProcessSub')}
    </div>

    <div class="dcard span6 ${S.plan==='premium'?'':'locked'}">
      <h3 style="color:var(--f8-rose);">🎬 ${T(UI.storyH)} <span class="pill paid">${T(UI.paidBadge)}</span></h3>
      ${lockCard(`<div class="story-arc" style="grid-template-columns:1fr;">
        ${genStory().map((p,i)=>`<div class="story-panel">
          <div style="display:flex;align-items:center;gap:10px;"><div class="sp-num">${i+1}</div><div><div class="sp-role">${p.role}</div><div class="sp-title">${p.title}</div></div></div>
          <div class="sp-text">${p.text}</div></div>`).join('')}
      </div>
      <div class="story-tips">${S.lang==='de'
        ?'<b>Rhetorik-Werkzeuge (Lancaster):</b> Dreierregel («Fokussieren. Beweisen. Skalieren.») · Kontrast («Nicht mehr tun — das Richtige tun.») · Wiederholen Sie einen Schlüsselsatz in jeder Sitzung · Beginnen Sie mit einer persönlichen Geschichte, nicht mit Folie 1.'
        :'<b>Rhetoric toolkit (Lancaster):</b> Rule of three (“Focus. Prove. Scale.”) · Contrast (“Not doing more — doing what matters.”) · Repeat one key phrase in every meeting · Open with a personal story, not slide 1.'}</div>`,'lockStory','lockStorySub')}
    </div>

    <div class="span12 disclaimer">${T(UI.disclaimer)}</div>
  </div>`;
}
function alignBlock(a){
  const st=a.alignTeam||'untested';
  const cls=st==='aligned'?'good':(st==='mostly'?'warn':'bad');
  const lbl=chipLabel(FLOW.find(s=>s.id==='alignTeam'),st);
  return `<div class="align-status ${cls}">${esc(lbl)}</div>
    <div style="font-size:13.5px;line-height:1.6;color:var(--f8-ink-soft);">
      <b style="color:var(--f8-ink);">${T(UI.alignTrueLabel)}</b><br>${esc(a.alignTrue||'—')}
    </div>
    ${(st==='split'||st==='untested')?`<div style="margin-top:10px;font-size:12.5px;color:var(--f8-amber);font-weight:600;">${S.lang==='de'?'→ Genau hier setzt der Alignment-Prozess an (Premium).':'→ This is exactly where the alignment process starts (Premium).'}</div>`:''}`;
}
function processBlock(){
  const items = S.lang==='de' ? [
    ['📊','<b>Marktdaten-Paket.</b> Ihre Spielfeld-Hypothese gegen echte Markt- und Wettbewerbsdaten geprüft.'],
    ['💰','<b>Finanz-Realitätscheck.</b> Der CHF-Preis und die Scorecard gegen Ihre Zahlen gerechnet.'],
    ['👥','<b>Team-Inputs.</b> Jedes Führungsmitglied durchläuft die LENS separat — die Unterschiede sind der wertvollste Befund.'],
    ['📣','<b>Kunden- & Lieferantenreklamationen.</b> Die ehrlichste Datenquelle, die Sie besitzen — systematisch ausgewertet gegen Ihre Gewinnlogik.'],
    ['🏔','<b>Moderiertes Führungs-Offsite.</b> Aus der Hypothese wird eine getragene Strategie — moderiert von facilit8.']
  ] : [
    ['📊','<b>Market data pack.</b> Your where-to-play hypothesis tested against real market and competitor data.'],
    ['💰','<b>Financial reality check.</b> The CHF prize and scorecard run against your actual numbers.'],
    ['👥','<b>Team inputs.</b> Each leadership member runs the LENS separately — the differences are the most valuable finding.'],
    ['📣','<b>Customer & supplier complaints.</b> The most honest data you own — mined systematically against your win logic.'],
    ['🏔','<b>Facilitated leadership offsite.</b> The hypothesis becomes a strategy your team carries — facilitated by facilit8.']
  ];
  return items.map(i=>`<div class="process-item"><div class="pi-ico">${i[0]}</div><div>${i[1]}</div></div>`).join('')
    +`<div style="margin-top:12px;"><a class="btn btn-premium" style="text-decoration:none;font-size:13px;padding:10px 18px;" href="mailto:hello@facilit8.org?subject=${encodeURIComponent('StrategyLENS alignment process — '+(S.answers.company||''))}">${S.lang==='de'?'Alignment-Prozess anfragen':'Enquire about the alignment process'}</a></div>`;
}
function emailStatus(msg,cls){
  const el=$('email-status'); if(!el) return;
  if(!msg){ el.style.display='none'; el.textContent=''; el.className='email-status'; return; }
  el.style.display='block'; el.textContent=msg; el.className='email-status'+(cls?' '+cls:'');
}
function buildEmailSummary(a){
  return `StrategyLENS — ${a.company||''}\n\n`+
    `${S.lang==='de'?'Sieg-Ambition':'Winning aspiration'}: ${a.aspiration||''}\n`+
    `${S.lang==='de'?'Spielfeld':'Where to play'}: ${a.whereDetail||''}\n`+
    `${S.lang==='de'?'Nicht spielen':'Not playing'}: ${a.notPlay||''}\n`+
    `${S.lang==='de'?'Gewinnlogik':'How to win'}: ${a.whyBuy||''}\n`+
    `${S.lang==='de'?'KI-Entscheidung':'AI choice'}: ${a.aiFirst||''}\n`+
    `${S.lang==='de'?'Preis (CHF/Jahr)':'Prize (CHF/yr)'}: ${a.prize||'—'}\n\n`+
    `${S.lang==='de'?'Vollständiges Dashboard: Drucken/PDF im Browser.':'Full dashboard: use Print/PDF in the browser.'}`;
}
async function emailDashboard(){
  const a=S.answers;
  const to=window.prompt(T(UI.emailPrompt)); if(!to) return;
  const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!EMAIL_RE.test(to.trim())){ emailStatus(T(UI.emailInvalid),'err'); return; }
  const ccFacilit8=window.confirm(T(UI.emailCc));
  emailStatus(T(UI.emailSending),'pending');
  try{
    const res=await fetch('/api/strategylens/email',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        to:to.trim(), ccFacilit8, lang:S.lang,
        company:a.company||'', summary:buildEmailSummary(a)
      })
    });
    let data={}; try{ data=await res.json(); }catch(e){}
    if(res.ok && data.ok) emailStatus(T(UI.emailSent),'ok');
    else emailStatus(T(UI.emailError),'err');
  }catch(e){
    emailStatus(T(UI.emailError),'err');
  }
}
function cfStep(n,label,value,not,ai){
  return `<div class="cf-step ${ai?'ai':''}">
    <div class="cf-rail"><div class="cf-dot">${n}</div>${n<6?'<div class="cf-line"></div>':''}</div>
    <div class="cf-body"><div class="cf-label">${label}</div><div class="cf-value">${value}</div>${not?`<div class="cf-not">${not}</div>`:''}</div></div>`;
}


/* ══════════════════════ BOOT ══════════════════════ */
window.S=S; window.FLOW=FLOW; window.UI=UI; /* exposed for dev tooling */
(async function(){
  setLang(document.documentElement.lang==='de'?'de':'en');
  renderCascade();
  const saved=loadState();
  if(saved && saved.S && (saved.S.step>0 || saved.S.finished)){
    S.lang=saved.S.lang||S.lang;
    setLangUnlocked(S.lang);
    await botSay(esc(T(UI.resumeQ)));
    $('chat-input').innerHTML=`<div class="chips">
      <button class="chip" onclick="resumeSessionClick()">▶ ${T(UI.resumeYes)}</button>
      <button class="chip" onclick="startFresh()">↺ ${T(UI.resumeNo)}</button></div>`;
    window._saved=saved;
    return;
  }
  await askStep(FLOW[0]);
})();
async function resumeSessionClick(){ userSay(T(UI.resumeYes)); $('chat-input').innerHTML=''; await resumeSession(window._saved); }
async function startFresh(){ userSay(T(UI.resumeNo)); clearState(); $('chat-input').innerHTML=''; await askStep(FLOW[0]); }

</script>
