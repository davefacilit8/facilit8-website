[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/js/i18n.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lifelens.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/strategylens.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# LifeLENS is a private, single-user tool. There is no static lifelens.html
# file in this repo — the page only exists inside the Netlify Function below,
# which checks a signed cookie (set after a correct password) before it will
# ever render the real content. Anyone hitting the URL without that cookie
# just gets a password form.
[[redirects]]
  from = "/lifelens.html"
  to = "/.netlify/functions/lifelens"
  status = 200
  force = true

[[redirects]]
  from = "/api/lifelens/state"
  to = "/.netlify/functions/lifelens-state"
  status = 200
  force = true

# StrategyLENS is a public soft-launch (noindex, unlisted) — clean slug only,
# not linked from the homepage or sitemap yet.
[[redirects]]
  from = "/strategylens"
  to = "/strategylens.html"
  status = 200

[[redirects]]
  from = "/api/strategylens/email"
  to = "/.netlify/functions/strategylens-email"
  status = 200
  force = true

# Impact Checklist — public free tool plus its four functions.
[[redirects]]
  from = "/impact-checklist"
  to = "/impact-checklist.html"
  status = 200

[[redirects]]
  from = "/api/impact/access"
  to = "/.netlify/functions/impact-access"
  status = 200
  force = true

[[redirects]]
  from = "/api/impact/submit"
  to = "/.netlify/functions/impact-submit"
  status = 200
  force = true

[[redirects]]
  from = "/api/impact/benchmark"
  to = "/.netlify/functions/impact-benchmark"
  status = 200
  force = true

[[redirects]]
  from = "/api/impact/count"
  to = "/.netlify/functions/impact-count"
  status = 200
  force = true

[[headers]]
  for = "/js/impact-checklist.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
