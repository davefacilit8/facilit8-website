# Runs the Impact Checklist acceptance tests on GitHub's machines.
# Nothing here affects the live site or the Netlify build.
name: Impact Checklist tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Function tests
        run: npm run test:functions

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the Playwright report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 7
